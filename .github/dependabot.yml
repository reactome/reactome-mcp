version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    ignore:
      # TypeScript is held at 5.x: typescript-eslint does not support TS 7, and
      # taking it would mean dropping the type-aware linting that found two real
      # bugs the week it was added. Without this rule dependabot reopens the
      # same PR every Monday and the decision gets relitigated weekly.
      #
      # Remove this when reactome/reactome-mcp#29 closes.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      # Batch dev-dependency bumps (vitest, typescript, @types/*) into a
      # single PR — they churn often and aren't worth separate reviews.
      dev-dependencies:
        dependency-type: development
      # Same for patch/minor runtime bumps.
      runtime-patch-minor:
        dependency-type: production
        update-types:
          - patch
          - minor

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - ci
