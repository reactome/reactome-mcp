version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    ignore:
      # `typescript` is held at 6.x on purpose. It is not the compiler that
      # builds this project -- that is TypeScript 7, installed as the alias
      # `typescript-7` -- it is the copy typescript-eslint loads, and
      # typescript-eslint throws on TS >= 7. Bumping this package to 7 would
      # disable linting entirely while changing nothing about the build.
      #
      # Without this rule dependabot reopens the same PR every Monday and the
      # decision gets relitigated weekly.
      #
      # Remove this when reactome/reactome-mcp#29 closes, at which point
      # `typescript` moves to 7 and the `typescript-7` alias goes away.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      # Batch dev-dependency bumps (vitest, typescript, @types/*) into a
      # single PR — they churn often and aren't worth separate reviews.
      dev-dependencies:
        dependency-type: development
      # Same for patch/minor runtime bumps.
      runtime-patch-minor:
        dependency-type: production
        update-types:
          - patch
          - minor

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - ci
